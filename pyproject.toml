[build-system]
requires = ["setuptools>=84,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "market-research"
version = "0.3.0"
description = "Local stock, fund and index research with durable analysis jobs"
requires-python = ">=3.14,<3.15"
dependencies = [
  "akshare==1.20.70", "pandas==3.1.1", "numpy==2.5.5",
  "scipy==1.18.1", "scikit-learn==1.9.1", "matplotlib==3.11.2",
  "requests==2.34.2", "duckdb==2.0.1",
  "fastapi==0.165.0", "uvicorn==0.54.0", "pydantic==2.14.4",
]

[dependency-groups]
dev = ["httpx2==2.16.2"]

[project.scripts]
market-research = "market_research.api.app:main"
market-research-worker = "market_research.tasks.worker:main"
market-research-sync = "market_research.tasks.sync:main"

market-research-cli = "market_research.cli.main:main"

# 短别名：与上面的入口完全等价，保留旧入口以兼容既有脚本。
fil = "market_research.cli.main:main"
fil-serve = "market_research.api.app:main"
fil-worker = "market_research.tasks.worker:main"
fil-sync = "market_research.tasks.sync:main"

[tool.setuptools.packages.find]
where = ["src", "compat"]
include = ["market_research*", "src", "webapp", "webapp.api"]
namespaces = false

[tool.setuptools.package-data]
"market_research.data" = ["migrations/*.sql"]
"market_research.api" = ["static/*.html", "static/*.js", "static/*.css", "static/vendor/*",
                         "static/*.ico", "static/*.svg", "static/*.png", "static/*.webmanifest"]
