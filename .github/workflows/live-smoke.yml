name: Live Data Smoke

on:
  schedule:
    # 工作日上海时间 10:17（UTC 02:17）；是否执行由仓库变量控制。
    - cron: "17 2 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: live-data-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || vars.LIVE_SMOKE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIL_DISCLOSURE_SCOPE: internal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install package
        run: pip install -e .
      - name: Run real-data smoke
        id: smoke
        continue-on-error: true
        run: |
          mkdir -p output/results/smoke
          python -u scripts/smoke_real.py --code 110022 --out output/results/smoke
      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke-${{ github.run_id }}
          path: output/results/smoke
          if-no-files-found: warn
      - name: Open failure issue
        if: always() && steps.smoke.outcome == 'failure' && vars.LIVE_SMOKE_ALERT == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'output/results/smoke/smoke_result.json';
            const report = fs.existsSync(path)
              ? JSON.parse(fs.readFileSync(path, 'utf8'))
              : {stage: 'workflow', failure_class: 'unknown', error: 'No smoke_result.json'};
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = 'Live data smoke failed';
            const body = [
              `Run: ${runUrl}`,
              `Stage: ${report.stage || 'unknown'}`,
              `Class: ${report.failure_class || 'unknown'}`,
              `Error: ${report.error || 'unknown'}`,
              '',
              '```text',
              String(report.trace || '').slice(0, 3000),
              '```'
            ].join('\n');
            const {data: issues} = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            if (!issues.some(issue => issue.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
      - name: Mark workflow failed after diagnostics
        if: steps.smoke.outcome == 'failure'
        run: exit 1
