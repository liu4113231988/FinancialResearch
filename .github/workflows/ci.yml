name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install package
        run: pip install -e .
      - name: Python syntax check
        run: python -m compileall -q src scripts
      - name: JavaScript syntax check
        run: |
          for f in src/market_research/api/static/*.js; do
            node --check "$f"
          done
      - name: Unit tests
        run: python -u -m unittest discover -s tests -p "test_*.py" -t .
